# Import * from "../**/*.graphql"

type Hospital {
	location: location
	name: String!
	userid: String!
	Id: ID!
	description: String!
	status: Boolean
	contactperson: ContactPerson
	contactDetails: ContactDetails
	logourl: String!
	patientCount: Int!
	invoiceCount: Int!
	metadata: Metadata
	paymentMethods: [PaymentMethod]
	environment: Environment
}

enum Environment {
	Prod
	Dev
}


type ContactPerson {
	name: String!
	phone: String!
	email: String!
	position: String!
	address: String!
}

type ContactDetails {
	phone: String!
	email: String!
	address: String!
}
