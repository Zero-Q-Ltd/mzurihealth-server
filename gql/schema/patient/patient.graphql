# Import * from "../**/*.graphql"

type Patient {
	personalInfo: ID!
	fileinfo: HospFile!
	done: Boolean!
	hospAdmin: HospAdmin!
	Id: ID!
	parentId: String
	nextOfKin: NextOfKin!
	insurance: [Insurance]!
	medicalInfo: MedicalInfo
}

enum NewPatient {
	Patient
}


type NextOfKin {
	name: String
	relationship: String
	phone: String
	workplace: String
}

type MedicalInfo {
	bloodtype: String
	conditions: [Condition]
	allergies: [Allergy]
	vitals: Vitals
	metadata: Metadata
}
