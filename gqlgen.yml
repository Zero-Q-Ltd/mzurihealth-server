# .gqlgen.yml example
#
# Refer to https://gqlgen.com/config/
# for detailed .gqlgen.yml documentation.


schema:
- schema.graphql
exec:
  filename: generated.go
model:
  filename: models_gen.go
models:
  HospAdmin:
    model: github.com/kisinga/mzurihealth/models.HospAdmin
  Hospital: 
    model: github.com/kisinga/mzurihealth/models.Hospital
  HospFile: 
    model: github.com/kisinga/mzurihealth/models.HospFile
  Patient: 
    model: github.com/kisinga/mzurihealth/models.Patient
  PaymentChannel:
    model: github.com/kisinga/mzurihealth/models.PaymentChannel
  RawProcedure:
    model: github.com/kisinga/mzurihealth/models.RawProcedure
  Insurance:
    model: github.com/kisinga/mzurihealth/models.Insurance
  Allergy:
    model: github.com/kisinga/mzurihealth/models.Allergy
  Condition:
    model: github.com/kisinga/mzurihealth/models.Condition
  Metadata:
    model: github.com/kisinga/mzurihealth/models.Metadata
  Nextofkin:
    model: github.com/kisinga/mzurihealth/models.Nextofkin
  Medicalinfo:
    model: github.com/kisinga/mzurihealth/models.Medicalinfo
  Vitals:
    model: github.com/kisinga/mzurihealth/models.Vitals
 
resolver:
  filename: resolver.go
  type: Resolver
autobind: []
